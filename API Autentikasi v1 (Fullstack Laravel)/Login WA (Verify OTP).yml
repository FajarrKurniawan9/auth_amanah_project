info:
  name: Login WA (Verify OTP)
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/v1/login/whatsapp/verify"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "phone_number": "081234567890",
        "otp": "1234"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
