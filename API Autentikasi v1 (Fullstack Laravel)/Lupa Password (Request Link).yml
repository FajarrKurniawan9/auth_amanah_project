info:
  name: Lupa Password (Request Link)
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/api/v1/password/email"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "test@example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
