info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/register"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Testing User",
        "email": "test@example.com",
        "phone_number": "081234567890",
        "password": "password",
        "password_confirmation": "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
