info:
  name: Login Email
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/login/email"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "kasir@gmail.com",
        "password": "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
