info:
  name: Reset Password
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/api/v1/password/reset"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "test@example.com",
        "token": "token_reset_dari_email",
        "password": "newpassword123",
        "password_confirmation": "newpassword123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
